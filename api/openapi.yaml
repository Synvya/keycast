openapi: 3.0.3
info:
  title: Keycast HTTP API
  version: 1.0.0
  description: |
    # Keycast HTTP Signing API

    Fast HTTP signing for Nostr events without NIP-46 relay overhead. Keycast provides both traditional NIP-46 remote signing and a high-performance HTTP API for low-latency signing operations.

    ## Authentication

    Most endpoints require a UCAN token obtained from the `/auth/login` or `/auth/register` endpoints. Include the token in the `Authorization` header:

    ```
    Authorization: Bearer <your-jwt-token>
    ```

    ## Performance

    - **Fast Path**: ~10ms signing using cached handlers (unified mode)
    - **Slow Path**: ~50-100ms signing using database + KMS decryption

    ## Security Notes

    ⚠️ **Current Limitations**:
    - No permission validation on HTTP signing endpoint
    - No rate limiting (endpoints can be called unlimited times)
    - UCAN tokens valid for 24 hours

    These limitations are being addressed in upcoming releases.

  contact:
    name: Keycast Support
    url: https://github.com/rabble/keycast
  license:
    name: MIT
servers:
  - url: https://login.divine.video/api
    description: Production server
  - url: http://localhost:3000/api
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: UCAN token from /auth/register or /auth/login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    CustomerAppOrigin:
      type: object
      properties:
        origin: { type: string }
        merchant_name: { type: string, description: The origin's own name, used in the sign-in email }
        merchant_pubkey:
          type: string
          nullable: true
          description: The merchant when the list has exactly one, otherwise null
        merchants:
          type: array
          description: The merchants a grant from this origin may name
          items:
            type: object
            properties:
              merchant_pubkey: { type: string, description: 64 lowercase hex }
              merchant_name: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    BuyerTeamMembership:
      type: object
      properties:
        team_pubkey: { type: string, description: The team key, 64 lowercase hex }
        name: { type: string }
        role: { type: string, enum: [admin, orderer, viewer] }
        joined_at: { type: string, format: date-time }

    BuyerTeamMembers:
      type: object
      properties:
        team_pubkey: { type: string }
        name: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              pubkey: { type: string, description: The member's personal key }
              email: { type: string, nullable: true }
              role: { type: string, enum: [admin, orderer, viewer] }
              joined_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "SecureP@ssw0rd"
        nsec:
          type: string
          description: Optional user-provided Nostr secret key (nsec or hex format). If not provided, a new key will be generated.
          example: "nsec1..."
      required:
        - email
        - password

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          description: User's public key (hex format)
        email:
          type: string
        pubkey:
          type: string
          description: User's Nostr public key (hex format)
        token:
          type: string
          description: UCAN authentication token
      required:
        - user_id
        - email
        - pubkey
        - token

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: UCAN authentication token
        pubkey:
          type: string
          description: User's Nostr public key (hex format)
      required:
        - token
        - pubkey

    NostrEvent:
      type: object
      description: Nostr event structure (NIP-01)
      properties:
        kind:
          type: integer
          description: Event kind number
          example: 1
        content:
          type: string
          description: Event content
          example: "Hello Nostr!"
        tags:
          type: array
          items:
            type: array
            items:
              type: string
          example: [["p", "pubkey123"], ["e", "eventid456"]]
        created_at:
          type: integer
          description: Unix timestamp
          example: 1234567890
      required:
        - kind
        - content
        - tags
        - created_at

    SignedNostrEvent:
      allOf:
        - $ref: '#/components/schemas/NostrEvent'
        - type: object
          properties:
            id:
              type: string
              description: Event ID (hex format)
            pubkey:
              type: string
              description: Author's public key (hex format)
            sig:
              type: string
              description: Schnorr signature (hex format)
          required:
            - id
            - pubkey
            - sig

    SignEventRequest:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/NostrEvent'
      required:
        - event

    SignEventResponse:
      type: object
      properties:
        signed_event:
          $ref: '#/components/schemas/SignedNostrEvent'
      required:
        - signed_event

    BunkerUrlResponse:
      type: object
      properties:
        bunker_url:
          type: string
          format: uri
          description: NIP-46 bunker connection string
          example: "bunker://pubkey?relay=wss://relay.example.com&secret=xyz"
      required:
        - bunker_url

    PubkeyResponse:
      type: object
      properties:
        pubkey:
          type: string
          description: Public key in hex format
          example: "abc123..."
        npub:
          type: string
          description: Public key in bech32 format
          example: "npub1..."
      required:
        - pubkey
        - npub

    UserProfile:
      type: object
      properties:
        public_key:
          type: string
        username:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        email:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionInfo:
      type: object
      properties:
        bunker_public_key:
          type: string
        application_name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    AtprotoEnableRequest:
      type: object
      properties:
        username:
          type: string
          example: "alice"
      required:
        - username

    AtprotoStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether future ATProto cross-publishing is enabled for this user.
        state:
          type: string
          nullable: true
          enum:
            - pending
            - ready
            - failed
            - disabled
          description: Lifecycle state for ATProto provisioning. Null means ATProto has never been enabled.
          example: "pending"
        did:
          type: string
          nullable: true
          description: PLC DID assigned to the user once provisioning reaches the ready state.
          example: "did:plc:abc123"
        error:
          type: string
          nullable: true
          description: User-visible error from the last failed provisioning attempt, if any.
        username:
          type: string
          nullable: true
          description: Claimed username associated with the ATProto lifecycle state.
          example: "alice"
      required:
        - enabled

paths:
  /auth/register:
    post:
      summary: Register new user
      description: |
        Create a new user account with email/password authentication. Automatically generates a Nostr keypair and returns a UCAN token for immediate use.

        **BYOK Support**: You can optionally provide your own Nostr secret key via the `nsec` parameter. If not provided, a new key will be generated.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                summary: Register with auto-generated key
                value:
                  email: "user@example.com"
                  password: "SecurePassword123"
              byok:
                summary: Register with your own key (BYOK)
                value:
                  email: "user@example.com"
                  password: "SecurePassword123"
                  nsec: "nsec1abc123..."
      responses:
        '200':
          description: Successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request (email already exists, weak password, invalid nsec)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login
      description: Authenticate with email/password and receive a UCAN token valid for 24 hours.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/sign:
    post:
      summary: Sign Nostr event (Fast HTTP signing)
      description: |
        Sign a Nostr event via HTTP - **10-50x faster than NIP-46**.

        ## Performance
        - **Fast path** (~10ms): Uses cached authorization handlers in unified mode
        - **Slow path** (~50-100ms): Decrypts key from database using KMS

        ## ⚠️ Security Warning
        **This endpoint currently has NO permission validation**. Any authenticated user can sign any event kind with any content. Permission checks are coming in a future release.

        ## Supported Event Kinds
        Currently accepts all Nostr event kinds (0-65535), including:
        - `kind: 0` - User metadata
        - `kind: 1` - Short text note
        - `kind: 3` - Contact list
        - `kind: 4` - Encrypted direct message
        - `kind: 5` - Deletion
        - `kind: 1984` - Reporting
        - `kind: 9734-9735` - Zaps
        - `kind: 10000+` - Replaceable events
        - `kind: 20000+` - Ephemeral events
        - `kind: 30000+` - Parameterized replaceable events
      tags:
        - Signing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignEventRequest'
            examples:
              text_note:
                summary: Sign a text note (kind 1)
                value:
                  event:
                    kind: 1
                    content: "Hello from Keycast!"
                    tags: []
                    created_at: 1234567890
              dm:
                summary: Sign encrypted DM (kind 4)
                value:
                  event:
                    kind: 4
                    content: "encrypted_content_here"
                    tags: [["p", "recipient_pubkey"]]
                    created_at: 1234567890
      responses:
        '200':
          description: Event successfully signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignEventResponse'
        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found or key not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Signing failed (KMS error, invalid key, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/bunker:
    get:
      summary: Get NIP-46 bunker URL
      description: |
        Retrieve the NIP-46 bunker connection string for traditional relay-based signing.

        Use this when you need full NIP-46 compatibility with permission validation, or when HTTP signing is not available.
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bunker URL retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BunkerUrlResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/pubkey:
    get:
      summary: Get user's public key
      description: Returns the user's Nostr public key in both hex and npub (bech32) formats.
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Public key retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PubkeyResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/profile:
    get:
      summary: Get user profile
      description: Retrieve the authenticated user's profile information including email, username, and Nostr metadata.
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Update user profile
      description: Update username, display name, or avatar URL for the authenticated user.
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "alice"
                display_name:
                  type: string
                  example: "Alice Smith"
                avatar_url:
                  type: string
                  format: uri
                  example: "https://example.com/avatar.jpg"
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/atproto/enable:
    post:
      summary: Enable ATProto provisioning
      description: Enable ATProto opt-in after username claim, return the claimed username with a pending lifecycle state, and trigger provisioning.
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtprotoEnableRequest'
      responses:
        '202':
          description: ATProto provisioning accepted and lifecycle set to pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtprotoStatusResponse'
        '400':
          description: Username missing, unclaimed, or mismatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/atproto/status:
    get:
      summary: Get ATProto lifecycle status
      description: Returns the authenticated user's enabled flag, lifecycle state, DID, last provisioning error, and claimed username.
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current ATProto status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtprotoStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/atproto/disable:
    post:
      summary: Disable ATProto publishing
      description: Disable ATProto publishing for the authenticated user, trigger downstream cleanup, and return enabled=false with state=disabled.
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ATProto publishing disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtprotoStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/sessions:
    get:
      summary: List active sessions
      description: Get all active NIP-46 authorization sessions for the authenticated user.
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/sessions/revoke:
    post:
      summary: Revoke a session
      description: Revoke an active NIP-46 authorization session by its bunker public key.
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bunker_pubkey:
                  type: string
                  description: Bunker public key to revoke
              required:
                - bunker_pubkey
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /.well-known/nostr.json:
    get:
      summary: NIP-05 discovery
      description: |
        NIP-05 identifier verification endpoint.

        Query by username: `/.well-known/nostr.json?name=alice`
      tags:
        - Discovery
      parameters:
        - name: name
          in: query
          required: false
          description: Username to look up
          schema:
            type: string
            example: alice
      responses:
        '200':
          description: NIP-05 discovery response
          content:
            application/json:
              schema:
                type: object
                properties:
                  names:
                    type: object
                    additionalProperties:
                      type: string
                    example:
                      alice: "abc123..."
                  relays:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      "abc123...": ["wss://relay.example.com"]

  /.well-known/oauth-authorization-server:
    get:
      summary: ATProto authorization server metadata
      description: OAuth metadata for the dedicated ATProto authorization server surface.
      tags:
        - Discovery
      responses:
        '200':
          description: Authorization server metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - issuer
                  - authorization_endpoint
                  - token_endpoint
                  - pushed_authorization_request_endpoint
                  - scopes_supported
                  - token_endpoint_auth_methods_supported
                  - token_endpoint_auth_signing_alg_values_supported
                  - client_id_metadata_document_supported
                  - authorization_response_iss_parameter_supported
                  - require_pushed_authorization_requests
                  - dpop_signing_alg_values_supported
                properties:
                  issuer:
                    type: string
                    format: uri
                  authorization_endpoint:
                    type: string
                    format: uri
                  token_endpoint:
                    type: string
                    format: uri
                  pushed_authorization_request_endpoint:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_methods_supported:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_signing_alg_values_supported:
                    type: array
                    items:
                      type: string
                  client_id_metadata_document_supported:
                    type: boolean
                  authorization_response_iss_parameter_supported:
                    type: boolean
                  require_pushed_authorization_requests:
                    type: boolean
                  dpop_signing_alg_values_supported:
                    type: array
                    items:
                      type: string

  /atproto/oauth/par:
    post:
      summary: Create an ATProto pushed authorization request
      description: Requires an initial DPoP proof and returns a session `request_uri` plus a `DPoP-Nonce` header for the next token exchange. Confidential clients with `token_endpoint_auth_method=private_key_jwt` must also include `client_assertion_type` and `client_assertion`.
      tags:
        - Authentication
      parameters:
        - in: header
          name: DPoP
          required: true
          schema:
            type: string
          description: Compact DPoP proof JWT for the PAR request.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - redirect_uri
                - scope
                - code_challenge
                - code_challenge_method
              properties:
                client_id:
                  type: string
                  format: uri
                  description: Public clients may use a direct origin-style client ID. Confidential clients use an HTTPS metadata-document URL.
                redirect_uri:
                  type: string
                  format: uri
                scope:
                  type: string
                  example: atproto
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  example: S256
                client_assertion_type:
                  type: string
                  example: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  description: Required when the resolved client metadata declares `token_endpoint_auth_method=private_key_jwt`.
                client_assertion:
                  type: string
                  description: ES256 `private_key_jwt` assertion whose `iss` and `sub` equal `client_id` and whose `aud` equals the authorization-server issuer.
      responses:
        '200':
          description: PAR created
          headers:
            DPoP-Nonce:
              schema:
                type: string
              description: Nonce that must be echoed in the next DPoP proof sent to the token endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_uri
                  - expires_in
                properties:
                  request_uri:
                    type: string
                  expires_in:
                    type: integer
        '400':
          description: Invalid PAR request or missing/invalid DPoP proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /atproto/oauth/token:
    post:
      summary: Exchange an ATProto authorization code or refresh token
      description: Requires a DPoP proof, rotates the session nonce via `DPoP-Nonce`, and returns DPoP-bound access and refresh tokens. Confidential clients must continue to present the same `private_key_jwt` client-auth key that was bound at PAR.
      tags:
        - Authentication
      parameters:
        - in: header
          name: DPoP
          required: true
          schema:
            type: string
          description: Compact DPoP proof JWT for the token request.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - type: object
                  required:
                    - grant_type
                    - code
                    - client_id
                    - redirect_uri
                    - code_verifier
                  properties:
                    grant_type:
                      type: string
                      enum: [authorization_code]
                    code:
                      type: string
                    client_id:
                      type: string
                    redirect_uri:
                      type: string
                    code_verifier:
                      type: string
                    client_assertion_type:
                      type: string
                      example: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                    client_assertion:
                      type: string
                - type: object
                  required:
                    - grant_type
                    - refresh_token
                    - client_id
                  properties:
                    grant_type:
                      type: string
                      enum: [refresh_token]
                    refresh_token:
                      type: string
                    client_id:
                      type: string
                    client_assertion_type:
                      type: string
                      example: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                    client_assertion:
                      type: string
      responses:
        '200':
          description: DPoP-bound token response
          headers:
            DPoP-Nonce:
              schema:
                type: string
              description: Rotated nonce for the next DPoP-bound request in the session.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - refresh_token
                  - scope
                  - sub
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: DPoP
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
                    example: atproto
                  sub:
                    type: string
        '400':
          description: Invalid grant or DPoP proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Buyer teams. Customer routes exist only on the customer hostname and take the Bearer
  # session from /auth/magic-link/verify. Admin routes run on another hostname, full admin
  # (NIP-98 service auth or an admin UCAN), and act on the customer tenant.
  /customer/session:
    get:
      tags: [Buyer teams]
      summary: Whose session this is. Synvya Server calls it to make its own buyer session
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The session's personal key and email
          content:
            application/json:
              schema:
                type: object
                required: [pubkey, email]
                properties:
                  pubkey: { type: string, description: Personal key, 64 lowercase hex }
                  email: { type: string }
        '401': { description: Missing, forged or expired token, or a token of another tenant }
  /customer/teams:
    get:
      tags: [Buyer teams]
      summary: List the buyer teams the signed-in buyer belongs to
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items: { $ref: '#/components/schemas/BuyerTeamMembership' }
        '401': { description: No valid session }
    post:
      tags: [Buyer teams]
      summary: Make a buyer team and its key. The caller becomes its first admin
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200, description: 'Defaults to "Buyer account"' }
      responses:
        '200':
          description: The team. `team_pubkey` is the buyer account's id
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_pubkey: { type: string, description: 64 lowercase hex }
                  name: { type: string }
                  role: { type: string, enum: [admin] }
        '401': { description: No valid session }
  /customer/teams/members:
    get:
      tags: [Buyer teams]
      summary: List the members of a team the caller belongs to
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: team_pubkey, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The members, admins first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyerTeamMembers' }
        '404': { description: No such team, or the caller is not a member }
  /customer/teams/invite:
    post:
      tags: [Buyer teams]
      summary: Invite a person by email (team admin only)
      description: Emails a link to `app_url` with `team_invite=<token>` added. The person signs in with that email and calls /customer/teams/accept.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_pubkey, email, role, app_url]
              properties:
                team_pubkey: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, orderer, viewer] }
                app_url: { type: string, description: A page on an allowed app origin }
      responses:
        '200':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    type: object
                    properties:
                      email: { type: string }
                      role: { type: string }
                      expires_at: { type: string, format: date-time }
        '403': { description: The caller is not a team admin }
        '409': { description: Already a member, or an invitation is pending }
  /customer/teams/accept:
    post:
      tags: [Buyer teams]
      summary: Accept an invitation sent to the caller's email
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_pubkey: { type: string }
                  name: { type: string }
                  role: { type: string, enum: [admin, orderer, viewer] }
        '403': { description: The invitation was sent to another email }
        '404': { description: Unknown, used, revoked or expired invitation }
  /customer/teams/role:
    post:
      tags: [Buyer teams]
      summary: Change a member's role (team admin only)
      description: Refuses to demote the last admin. A member made a viewer loses their grants on the team key.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_pubkey, member_pubkey, role]
              properties:
                team_pubkey: { type: string }
                member_pubkey: { type: string }
                role: { type: string, enum: [admin, orderer, viewer] }
      responses:
        '200': { description: 'Changed: echoes team_pubkey, member_pubkey and role' }
        '403': { description: The caller is not a team admin }
        '409': { description: '`last_admin`: the team would have no admin' }
  /customer/teams/remove:
    post:
      tags: [Buyer teams]
      summary: Remove a member (team admin), or leave (the member)
      description: The member's grants on the team key are revoked at once. The last admin cannot leave or be removed.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_pubkey, member_pubkey]
              properties:
                team_pubkey: { type: string }
                member_pubkey: { type: string }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
                  revoked_grants: { type: integer }
        '403': { description: The caller is not a team admin }
        '409': { description: '`last_admin`' }
  /customer/teams/grant:
    post:
      tags: [Buyer teams]
      summary: Take a grant on the team key for the merchant of the app the caller signed in at
      description: |
        An admin or orderer gets `commerce_envelope` for the merchant, bound to their personal key:
        every envelope must carry `extensions["openmarkets:sent_by"].pubkey` equal to it. A viewer
        gets `decrypt_only`. The merchant comes from the approved app list, by the session's origin.
        `/auth/magic-link/verify` takes the same grant when it is sent `team_pubkey` with the grant fields.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_pubkey, client_id, redirect_uri, scope]
              properties:
                team_pubkey: { type: string }
                client_id: { type: string }
                redirect_uri: { type: string, description: Same origin as the session }
                scope: { type: string, enum: ['policy:commerce_envelope'] }
                merchant_pubkey: { type: string, description: 'Must be on the origin''s merchant list. May be omitted only when the list has one merchant; otherwise 400' }
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_pubkey: { type: string }
                  role: { type: string, enum: [admin, orderer, viewer] }
                  permission: { type: string, enum: [commerce_envelope, decrypt_only] }
                  session_token: { type: string, description: Names the grant; use it on /nostr }
                  expires_in: { type: integer }
                  authorization:
                    type: object
                    properties:
                      bunker_url: { type: string }
        '403': { description: Not a member of the team }
  /admin/customer-teams:
    get:
      tags: [Buyer teams]
      summary: List the buyer teams a customer belongs to (full admin)
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: pubkey, in: query, schema: { type: string } }
      responses:
        '200':
          description: The customer's teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  pubkey: { type: string }
                  teams:
                    type: array
                    items: { $ref: '#/components/schemas/BuyerTeamMembership' }
        '404': { description: No such customer }
    post:
      tags: [Buyer teams]
      summary: Make a buyer team and its key, with a first admin or with no member (full admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                admin_email: { type: string }
                admin_pubkey: { type: string, description: Send one of admin_email and admin_pubkey, or neither }
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_pubkey: { type: string }
                  name: { type: string }
                  admin_pubkey: { type: string, nullable: true }
        '404': { description: No such customer }
  /admin/customer-teams/{team_pubkey}:
    delete:
      tags: [Buyer teams]
      summary: Delete a team that has no member, with its key (full admin)
      parameters:
        - { name: team_pubkey, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '`{"deleted": true}`' }
        '404': { description: No such team }
        '409': { description: The team still has members }
  /admin/customer-teams/{team_pubkey}/members:
    get:
      tags: [Buyer teams]
      summary: List a team's members (full admin)
      parameters:
        - { name: team_pubkey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyerTeamMembers' }
        '404': { description: No such team }
  /admin/customer-teams/{team_pubkey}/admins:
    post:
      tags: [Buyer teams]
      summary: Make a customer an admin of the team (full admin)
      description: For a store invitation accepted and for the support restore. Adds the person, or raises their role.
      parameters:
        - { name: team_pubkey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                pubkey: { type: string }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_pubkey: { type: string }
                  admin_pubkey: { type: string }
        '404': { description: No such team or customer }
  /admin/customer-teams/{team_pubkey}/members/{member_pubkey}:
    delete:
      tags: [Buyer teams]
      summary: Remove a member and revoke their grants on the team key (full admin)
      description: For a buyer account closed. The last admin may go only when no other member remains, so the team is left empty with its key.
      parameters:
        - { name: team_pubkey, in: path, required: true, schema: { type: string } }
        - { name: member_pubkey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
                  revoked_grants: { type: integer }
        '404': { description: No such team, or not a member }
        '409': { description: '`last_admin`: other members remain' }
  # The approved app origins of the customer tenant. Owner hostname only, full admin.
  /admin/customer-origins:
    get:
      tags: [Customer origins]
      summary: List the approved origins, each with its merchant list (full admin)
      responses:
        '200':
          description: The origins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerAppOrigin' }
    post:
      tags: [Customer origins]
      summary: Put a merchant on an origin's list, approving the origin if it is new (full admin)
      description: |
        Merchants already on the list stay; posting a listed merchant again changes its name.
        Takes effect at once. Grants already made are not changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, merchant_name, merchant_pubkey]
              properties:
                origin: { type: string, description: 'https with no path, e.g. https://orders.example.com' }
                merchant_name: { type: string }
                merchant_pubkey: { type: string, description: Hex or npub; stored as hex }
                origin_name:
                  type: string
                  description: The origin's own name, for the sign-in email. When omitted, a one-merchant origin uses the merchant's name and a new origin starts with it
      responses:
        '200':
          description: The origin after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAppOrigin' }
        '400': { description: Invalid origin, merchant_name or merchant_pubkey }
    delete:
      tags: [Customer origins]
      summary: Take one merchant off an origin's list, or remove the origin (full admin)
      description: |
        With `merchant_pubkey`, only that merchant is removed; the origin's last merchant is
        refused with 409, so remove the origin instead. Without it, the origin and its list go.
        Authorizations already granted keep working until revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin: { type: string }
                merchant_pubkey: { type: string, description: Hex or npub }
      responses:
        '200': { description: '`{"removed": true}`, or false when the origin or merchant was not listed' }
        '400': { description: Invalid origin or merchant_pubkey }
        '409': { description: The merchant is the origin's last one }

tags:
  - name: Customer origins
    description: The apps allowed to sign customers in, and the merchants each sells for
  - name: Buyer teams
    description: Buyer accounts on the customer tenant, each a team with its own key
  - name: Authentication
    description: User registration and authentication endpoints
  - name: Signing
    description: Fast HTTP signing for Nostr events
  - name: User
    description: User profile and session management
  - name: Discovery
    description: NIP-05 identifier discovery
